conky.config = {
    -- ── Compositor (xcompmgr active — matches your original) ──────────────
    own_window             = true,
    own_window_type        = 'normal',
    own_window_hints       = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value  = 180,

    -- ── Layout ────────────────────────────────────────────────────────────
    alignment       = 'top_right',
    gap_x           = 12,
    gap_y           = 35,
    minimum_width   = 220,
    minimum_height  = 220,
    maximum_width   = 220,

    -- ── Behaviour ─────────────────────────────────────────────────────────
    background         = true,
    double_buffer      = true,
    no_buffers         = true,
    update_interval    = 1.0,       -- 1 s keeps the clock & gauges smooth
    total_run_times    = 0,
    cpu_avg_samples    = 4,
    override_utf8_locale = false,
    uppercase          = false,

    -- ── Drawing ───────────────────────────────────────────────────────────
    draw_shades        = true,
    draw_outline       = false,
    draw_borders       = false,
    draw_graph_borders = true,

    -- ── Font / colour ─────────────────────────────────────────────────────
    use_xft        = true,
    xftalpha       = 0.9,
    font           = 'Ubuntu:normal:size=7',
    default_color  = 'cccccc',
    default_shade_color  = 'black',
    default_outline_color = 'green',

    -- ── Lua ───────────────────────────────────────────────────────────────
    lua_load          = '~/.config/conky/clock.lua',
    lua_draw_hook_pre = 'conky_draw_all',
}

conky.text = [[
${voffset 310}
$color
SYSTEM ${hr 2}
$sysname $kernel on $machine
${font Open Sans Light:pixelsize=13}Uptime: ${uptime}${font}

CPU: ${alignr}${freq} MHz

Total CPU: ${cpu cpu0}%
${cpubar cpu0 10 2}

Core 1 ${alignr}${cpu cpu1}%
${cpubar 2 cpu1}
Core 2 ${alignr}${cpu cpu2}%
${cpubar 2 cpu2}
Core 3 ${alignr}${cpu cpu3}%
${cpubar 2 cpu3}
Core 4 ${alignr}${cpu cpu4}%
${cpubar 2 cpu4}

${color cccccc}Top CPU Processes ${hr 1}
${top name 1}${alignr}${top cpu 1}%
${top name 2}${alignr}${top cpu 2}%
${top name 3}${alignr}${top cpu 3}%
${top name 4}${alignr}${top cpu 4}%

CPU Package Temp: ${execi 30 sensors | grep "Package id 0" | cut -d "+" -f2 | cut -c1-7}
ACPI Temp: ${acpitemp} deg C

RAM ${hr 2}
Total: ${alignr}$memmax
Active: ${alignr}$mem ($memperc%)
${membar 4}

${color cccccc}Top RAM Processes ${hr 1}
${top_mem name 1}${alignr}${top_mem mem 1}%
${top_mem name 2}${alignr}${top_mem mem 2}%
${top_mem name 3}${alignr}${top_mem mem 3}%
${top_mem name 4}${alignr}${top_mem mem 4}%
${top_mem name 5}${alignr}${top_mem mem 5}%

Filesystem ${hr 2}
Root:  ${alignr}${fs_used /} / ${fs_size /}
${fs_bar 4 /}
Home:  ${alignr}${fs_used /home} / ${fs_size /home}
${fs_bar 4 /home}
Swap:  $swapperc% ${swapbar 6}

HDD ${hr 2}
/mnt/hdd
${fs_bar 4 /mnt/hdd}
${alignr}${fs_used /mnt/hdd} / ${fs_size /mnt/hdd}
/mnt/hdd2
${fs_bar 4 /mnt/hdd2}
${alignr}${fs_used /mnt/hdd2} / ${fs_size /mnt/hdd2}
/mnt/hdd3
${fs_bar 4 /mnt/hdd3}
${alignr}${fs_used /mnt/hdd3} / ${fs_size /mnt/hdd3}
]]
